# GitHub Pages Deployment Workflow
# This workflow builds and deploys the site to GitHub Pages.
# It includes diagnostic logging to confirm which commit was built and deployed.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    # Allows manual trigger from the Actions tab

# Sets permissions for the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full clone to ensure correct ref is checked out
          fetch-depth: 0

      - name: Display commit information
        run: |
          echo "============================================"
          echo "DEPLOYMENT DIAGNOSTICS"
          echo "============================================"
          echo "GITHUB_SHA: ${{ github.sha }}"
          echo "GITHUB_REF: ${{ github.ref }}"
          echo "GITHUB_EVENT_NAME: ${{ github.event_name }}"
          echo "============================================"
          echo "Git log (last 5 commits):"
          git --no-pager log --oneline -5
          echo "============================================"
          echo "Current HEAD:"
          git rev-parse HEAD
          echo "============================================"
          echo "Git status:"
          git status
          echo "============================================"

      - name: Detect and validate output directory
        id: detect-output
        run: |
          echo "Detecting output directory..."
          
          # For this static site, files are served from the repository root
          # Check for common static site patterns
          if [ -f "index.html" ]; then
            echo "Found index.html in root - using root directory as output"
            echo "output_dir=." >> $GITHUB_OUTPUT
            echo "OUTPUT_DIR=." >> $GITHUB_ENV
          elif [ -d "build" ] && [ -f "build/index.html" ]; then
            echo "Found build directory with index.html"
            echo "output_dir=build" >> $GITHUB_OUTPUT
            echo "OUTPUT_DIR=build" >> $GITHUB_ENV
          elif [ -d "dist" ] && [ -f "dist/index.html" ]; then
            echo "Found dist directory with index.html"
            echo "output_dir=dist" >> $GITHUB_OUTPUT
            echo "OUTPUT_DIR=dist" >> $GITHUB_ENV
          elif [ -d "docs" ] && [ -f "docs/index.html" ]; then
            echo "Found docs directory with index.html"
            echo "output_dir=docs" >> $GITHUB_OUTPUT
            echo "OUTPUT_DIR=docs" >> $GITHUB_ENV
          elif [ -d "public" ] && [ -f "public/index.html" ]; then
            echo "Found public directory with index.html"
            echo "output_dir=public" >> $GITHUB_OUTPUT
            echo "OUTPUT_DIR=public" >> $GITHUB_ENV
          else
            echo "ERROR: No valid output directory found!"
            echo "Expected one of: ./index.html, build/, dist/, docs/, public/"
            echo "Please check your project structure."
            exit 1
          fi
          
          echo "Output directory set to: $OUTPUT_DIR"

      - name: List files to be deployed
        run: |
          echo "============================================"
          echo "FILES TO BE DEPLOYED FROM: ${{ env.OUTPUT_DIR }}"
          echo "============================================"
          # Show directory structure (limited depth to avoid excessive output)
          find ${{ env.OUTPUT_DIR }} -maxdepth 3 -type f | head -100
          echo "============================================"
          echo "Total files: $(find ${{ env.OUTPUT_DIR }} -type f | wc -l)"
          echo "============================================"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTPUT_DIR }}

      - name: Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Output Directory | ${{ env.OUTPUT_DIR }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build artifact uploaded successfully." >> $GITHUB_STEP_SUMMARY

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment complete
        run: |
          echo "============================================"
          echo "DEPLOYMENT COMPLETE"
          echo "============================================"
          echo "Deployed commit: ${{ github.sha }}"
          echo "Page URL: ${{ steps.deployment.outputs.page_url }}"
          echo "============================================"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Site deployed to: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit \`${{ github.sha }}\` is now live." >> $GITHUB_STEP_SUMMARY
