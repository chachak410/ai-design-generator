<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dual Image Analyzer</title>
  <style>
    body { background: #f9f9f9; color: #333; }
    .container { 
      max-width: 1000px; 
      margin: 40px auto; 
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      font-family: Arial, Helvetica, sans-serif; 
    }
    h1 { text-align: center; color: #2c3e50; }
    .image-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 30px; 
      margin: 30px 0; 
    }
    .preview { 
      width: 100%; 
      max-height: 350px; 
      object-fit: contain; 
      border: 3px dashed #bdc3c7; 
      border-radius: 8px;
      background: #ecf0f1;
      margin-top: 10px;
    }
    .preview.loaded { border-style: solid; border-color: #3498db; }
    label { font-weight: bold; font-size: 1.1em; }
    .btn {
      display: block;
      width: 220px;
      margin: 30px auto;
      padding: 12px 20px;
      font-size: 1.1em;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover { background: #2980b9; }
    .btn:disabled { background: #95a5a6; cursor: not-allowed; }

    .result { 
      margin-top: 40px; 
      padding: 25px; 
      background: #e8f4f8; 
      border-radius: 10px; 
      border-left: 6px solid #3498db;
      display: none;
    }
    .result.show { display: block; animation: fadeIn 0.6s; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dual Image Analyzer</h1>
    <p style="text-align:center; color:#7f8c8d;">
      Upload two reference images and get a combined AI analysis
    </p>

    <div class="image-grid">
      <div>
        <label for="img1">Image 1</label><br>
        <input type="file" id="img1" accept="image/*" required>
        <img id="preview1" class="preview" src="" alt="Preview 1">
      </div>
      <div>
        <label for="img2">Image 2</label><br>
        <input type="file" id="img2" accept="image/*" required>
        <img id="preview2" class="preview" src="" alt="Preview 2">
      </div>
    </div>

    <button id="analyzeBtn" class="btn" disabled>Analyze Both Images</button>

    <div class="result" id="analysisResult">
      <h2>Combined Analysis:</h2>
      <p id="description">Loading analysis…</p>
    </div>
  </div>

  <script type="module">
    // Preview images when selected
    const previewImage = (inputId, previewId) => {
      const input = document.getElementById(inputId);
      const preview = document.getElementById(previewId);

      input.addEventListener('change', () => {
        const file = input.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = e => {
            preview.src = e.target.result;
            preview.classList.add('loaded');
          };
          reader.readAsDataURL(file);
        } else {
          preview.src = '';
          preview.classList.remove('loaded');
        }
        toggleAnalyzeButton();
      });
    };

    previewImage('img1', 'preview1');
    previewImage('img2', 'preview2');

    // Enable button only when both images are selected
    function toggleAnalyzeButton() {
      const img1 = document.getElementById('img1').files.length;
      const img2 = document.getElementById('img2').files.length;
      document.getElementById('analyzeBtn').disabled = !(img1 && img2);
    }

    // Main analysis click handler
    document.getElementById('analyzeBtn').addEventListener('click', async () => {
      const resultDiv = document.getElementById('analysisResult');
      const description = document.getElementById('description');
      
      resultDiv.classList.remove('show');
      description.textContent = 'Analyzing images, please wait…';

      const file1 = document.getElementById('img1').files[0];
      const file2 = document.getElementById('img2').files[0];

      // Convert files to base64
      const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      try {
        const [base64_1, base64_2] = await Promise.all([toBase64(file1), toBase64(file2)]);

        // Here you can replace this with your actual backend or API call
        // Example using xAI's Grok API (you need an API key):
        /*
        const response = await fetch('https://api.x.ai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer YOUR_API_KEY',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: "grok-beta",
            messages: [{
              role: "user",
              content: [
                { type: "text", text: "Describe these two images in detail and compare them." },
                { type: "image_url", image_url: { url: `data:${file1.type};base64,${base64_1}` } },
                { type: "image_url", image_url: { url: `data:${file2.type};base64,${base64_2}` } }
              ]
            }],
            max_tokens: 800
          })
        });
        const data = await response.json();
        description.textContent = data.choices[0].message.content;
        */

        // ---- DEMO / Placeholder response (remove when using real API) ----
        setTimeout(() => {
          description.innerHTML = `
            <strong>Image 1:</strong> A beautiful sunset over mountains with warm orange tones.<br><br>
            <strong>Image 2:</strong> A similar scene but taken during golden hour with more vivid reds and a lake in the foreground.<br><br>
            <strong>Comparison:</strong> Both photos capture the same mountain range. Image 2 has richer colors and adds a reflective lake, creating a more dramatic composition.
          `;
          resultDiv.classList.add('show');
        }, 1500);
        // ------------------------------------------------------------------

      } catch (err) {
        description.textContent = 'Error: ' + err.message;
        resultDiv.classList.add('show');
      }
    });
  </script>
</body>
</html>
